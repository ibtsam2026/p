<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11code.all.min.js

<input type="text" id="barcodeText" placeholder="أدخل النص">

<svg id="barcode"></svg>

<script>
document.getElementById("barcodeText")
.addEventListener("input", function () {

    const value = this.value.trim();

    if (!value) return;

    JsBarcode("#barcode", value, {
        format: "CODE128",
        lineColor: "#000",
        width: 2,
        height: 80,
        displayValue: true
    });

});
</script>
