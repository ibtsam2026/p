<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء رمز QR Code</title>
    <!-- استدعاء مكتبة QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .qr-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-generate {
            background-color: #007bff;
            color: white;
            margin-bottom: 10px;
        }
        .btn-generate:hover {
            background-color: #0056b3;
        }
        .btn-download {
            background-color: #28a745;
            color: white;
            display: none;
            margin-top: 15px;
        }
        .btn-download:hover {
            background-color: #218838;
        }
        #qrcode {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        #qrcode img {
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 8px;
            background: #fff;
        }
    </style>
</head>
<body>

<div class="qr-card">
    <h2>إنشاء QR Code</h2>
    
    <input type="text" id="qrText" placeholder="أدخل الرابط أو النص هنا...">
    
    <button class="btn-generate" onclick="generateQR()">إنشاء QR</button>
    
    <div id="qrcode"></div>
    
    <button id="downloadBtn" class="btn-download" onclick="downloadQR()">تحميل QR (PNG)</button>
</div>

<script>
    let qrcode = null;

    function generateQR() {
        const text = document.getElementById("qrText").value.trim();
        const qrContainer = document.getElementById("qrcode");
        const downloadBtn = document.getElementById("downloadBtn");

        if (!text) {
            alert("يرجى أدخال نص أو رابط أولاً");
            return;
        }

        // مسح الـ QR القديم إن وجد
        qrContainer.innerHTML = "";

        // إنشاء الـ QR Code الجديد
        qrcode = new QRCode(qrContainer, {
            text: text,
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // إظهار زر التحميل بعد إنشاء الرمز
        setTimeout(() => {
            downloadBtn.style.display = "block";
        }, 100);
    }

    function downloadQR() {
        const qrImg = document.querySelector("#qrcode img");
        const qrCanvas = document.querySelector("#qrcode canvas");
        let imageSrc = "";

        if (qrImg && qrImg.src) {
            imageSrc = qrImg.src;
        } else if (qrCanvas) {
            imageSrc = qrCanvas.toDataURL("image/png");
        }

        if (imageSrc) {
            const link = document.createElement("a");
            link.href = imageSrc;
            link.download = "qrcode.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }
</script>

</body>
</html>
